name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ReactorUnpack.slnx

      # Release, not Debug. Most of the suite is the bounded interpreter working through real
      # samples, and an unoptimized build runs it about five times slower.
      - name: Build
        run: dotnet build ReactorUnpack.slnx -c Release --no-restore

      # A public checkout has no samples, so the tests that read one are skipped here rather than
      # failed, and the run reports how many and why. Where the samples are present the same command
      # runs every one of them.
      - name: Test
        run: dotnet test ReactorUnpack.slnx -c Release --no-restore --no-build

      # The corpus needs samples that are not in the repository, so it runs only where they are
      # available. Skipping is correct rather than a gap: the unit suite already runs the corpus
      # determinism check against whatever samples are present.
      - name: Corpus
        if: hashFiles('samples/*.dll', 'samples/*.exe') != ''
        run: dotnet run --project src/ReactorUnpack.Cli -c Release --no-build -- corpus run
