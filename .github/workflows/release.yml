name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish'
        required: true

permissions:
  contents: write

jobs:
  publish:
    strategy:
      matrix:
        include:
          - runtime: win-x64
            artifact: cilantro-win-x64.zip
          - runtime: linux-x64
            artifact: cilantro-linux-x64.tar.gz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test release source
        run: dotnet test Cilantro.slnx -c Release

      # Self-contained and single-file, so the download runs on a machine that has never had .NET
      # installed. That is the whole point: an analyst should not have to provision a runtime
      # before they can look at a sample.
      - name: Publish ${{ matrix.runtime }}
        run: >
          dotnet publish src/Cilantro.Cli
          -c Release
          -r ${{ matrix.runtime }}
          -p:PublishSingleFile=true
          -o publish/${{ matrix.runtime }}

      # The MCP server ships in the same archive rather than one of its own. It is the same tool
      # reached a different way, and somebody who has downloaded CILantro and then wants to
      # point an agent at it should not have to work out that there is a second download.
      - name: Publish the MCP server for ${{ matrix.runtime }}
        run: >
          dotnet publish src/Cilantro.Mcp
          -c Release
          -r ${{ matrix.runtime }}
          -p:PublishSingleFile=true
          -o publish/${{ matrix.runtime }}

      # The archive is named for the tag, and the tool reports its own version. If those disagree the
      # download is mislabelled, and nobody reading a bug report against it can tell which build they
      # have. Only the Linux job can ask the binary; both jobs build the same source.
      - name: Check the tag against the tool
        if: matrix.runtime == 'linux-x64'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          reported="$(publish/linux-x64/cilantro --version)"
          if [ "${TAG#v}" != "$reported" ]; then
            echo "Tag $TAG does not match the version the tool reports, $reported." >&2
            exit 1
          fi

      - name: Smoke test Linux executables
        if: matrix.runtime == 'linux-x64'
        run: |
          publish/linux-x64/cilantro --help > /dev/null
          publish/linux-x64/cilantro --help-all > /dev/null
          dotnet build corpus/probes/Probe/Probe.csproj -c Release -f net10.0
          publish/linux-x64/cilantro corpus/probes/Probe/bin/Release/net10.0/Probe.dll \
            --generic-recovery --no-recursion --json -o "smoke/linux case" > smoke.json
          python3 - <<'PY'
          import json, pathlib, subprocess
          result = json.loads(pathlib.Path('smoke.json').read_text())
          assert result['Success'] and result['Verified']
          assert pathlib.Path(result['Wrote']['Cleaned']).is_file()
          error = subprocess.run(['publish/linux-x64/cilantro', '--bogus', '--json'], capture_output=True, text=True)
          assert error.returncode == 2 and json.loads(error.stdout)['Schema'] == 'cilantro.error/1'
          request = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}\n'
          mcp = subprocess.run(['publish/linux-x64/cilantro-mcp'], input=request, capture_output=True, text=True, timeout=30, check=True)
          assert json.loads(mcp.stdout.splitlines()[0])['result']['serverInfo']['version'] == result['ToolVersion']
          PY

      - name: Package
        run: |
          cd publish/${{ matrix.runtime }}
          rm -f *.pdb
          cp ../../LICENSE ../../README.md .
          cp -r ../../schema ../../profiles .
          mkdir -p docs/releases docs/assets
          for document in README agents analyst-workflows code-organization compatibility \
            completion-progress corpus declarations development devirtualization how-confuserex-works \
            how-net-reactor-works how-recovery-works protection-removal quick-start reading-the-output \
            status-report troubleshooting performance; do
            cp "../../docs/$document.md" docs/
          done
          cp ../../docs/releases/*.md docs/releases/
          cp ../../docs/assets/* docs/assets/
          mkdir -p corpus/schema corpus/probes/Probe
          cp ../../corpus/*.json corpus/
          cp ../../corpus/*.ps1 corpus/
          cp ../../corpus/*.py corpus/
          cp ../../corpus/schema/*.json corpus/schema/
          cp ../../corpus/probes/README.md corpus/probes/
          cp ../../corpus/probes/*.ps1 corpus/probes/
          cp ../../corpus/probes/Probe/*.cs ../../corpus/probes/Probe/*.csproj ../../corpus/probes/Probe/*.txt corpus/probes/Probe/
          if [ "${{ matrix.runtime }}" = "win-x64" ]; then
            zip -r ../../${{ matrix.artifact }} .
          else
            tar czf ../../${{ matrix.artifact }} .
          fi

      # Left archiving on, which is the default: the artifact is zipped for the hop between jobs and
      # arrives back as the file that went in. Uploading the archive unzipped instead would hand the
      # release job a Windows zip that the download step could reasonably decide to unpack.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.runtime }}
          path: ${{ matrix.artifact }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum cilantro-* > SHA256SUMS.txt

      - name: Select release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: cp "docs/releases/${TAG#v}.md" RELEASE-NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            cilantro-*
            SHA256SUMS.txt
          # A release missing the thing people came to download is worse than no release, and by
          # default an asset pattern that matches nothing is passed over in silence.
          fail_on_unmatched_files: true
          body_path: RELEASE-NOTES.md
          prerelease: false
