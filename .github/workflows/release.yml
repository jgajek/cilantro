name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish'
        required: true

permissions:
  contents: write

jobs:
  publish:
    strategy:
      matrix:
        include:
          - runtime: win-x64
            artifact: ReactorUnpack-win-x64.zip
          - runtime: linux-x64
            artifact: ReactorUnpack-linux-x64.tar.gz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Self-contained and single-file, so the download runs on a machine that has never had .NET
      # installed. That is the whole point: an analyst should not have to provision a runtime
      # before they can look at a sample.
      - name: Publish ${{ matrix.runtime }}
        run: >
          dotnet publish src/ReactorUnpack.Cli
          -c Release
          -r ${{ matrix.runtime }}
          -p:PublishSingleFile=true
          -o publish/${{ matrix.runtime }}

      # The archive is named for the tag, and the tool reports its own version. If those disagree the
      # download is mislabelled, and nobody reading a bug report against it can tell which build they
      # have. Only the Linux job can ask the binary; both jobs build the same source.
      - name: Check the tag against the tool
        if: matrix.runtime == 'linux-x64'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          reported="$(publish/linux-x64/ReactorUnpack --version)"
          if [ "${TAG#v}" != "$reported" ]; then
            echo "Tag $TAG does not match the version the tool reports, $reported." >&2
            exit 1
          fi

      - name: Package
        run: |
          cd publish/${{ matrix.runtime }}
          rm -f *.pdb
          cp ../../LICENSE ../../README.md .
          if [ "${{ matrix.runtime }}" = "win-x64" ]; then
            zip -r ../../${{ matrix.artifact }} .
          else
            tar czf ../../${{ matrix.artifact }} .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}
          path: ${{ matrix.artifact }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum ReactorUnpack-* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ReactorUnpack-*
            SHA256SUMS.txt
          generate_release_notes: true
